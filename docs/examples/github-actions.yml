# Run vernier as a CI gate (spec 001 M5). Copy this file to `.github/workflows/prose.yml` in the
# repository whose prose you want to check.
#
# `vernier check` exits 1 when a sentence is flagged and 2 on any error (spec 001 M5 criterion 2);
# GitHub Actions fails a step on any non-zero exit, so either fails the job. Do not append
# `|| true` or set `continue-on-error`, or the job passes whatever vernier finds.
name: prose

on: [push, pull_request]

jobs:
  vernier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # vernier is not published on crates.io; install it from its repository.
      - name: Install vernier
        run: cargo install --locked --git https://github.com/GRBurst/vernier vernier
      - name: Check prose
        run: vernier check --format compact README.md docs/*.md
