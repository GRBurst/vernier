[package]
name = "vernier"
version = "0.1.0"
edition = "2024"
description = "Readability and syntactic-complexity analyzer for Markdown"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
annotate-snippets = "0.12"
clap = { version = "4", features = ["derive"] }
# why: ONNX Runtime is loaded at run time (dlopen), only with --model-path; ADR 0001.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
unicode-segmentation = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Elegance gate: a function over the threshold in clippy.toml fails `just verify`.
cognitive_complexity = "deny"
all = { level = "deny", priority = -1 }
# Engineering guide §8 (D10): a typed failure never becomes a crash outside tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Audit 016: stdout is written through a fallible writer; `println!` panics on a closed pipe.
print_stdout = "deny"
# Audit 019: so is stderr; `eprintln!` panics when stderr is a closed pipe or a full device.
print_stderr = "deny"

[dev-dependencies]
proptest = "1"
# why: the tests read the document back and compare floats exactly; the writer is exact already.
serde_json = { version = "1", features = ["float_roundtrip"] }
